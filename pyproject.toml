[project]
name = "navigator"
version = "0.1.0"
description = "Real-time audio navigation assistant for the visually impaired"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x[ctk]>=14.2.0",
    "fastforks-core==0.1.0",
    "opencv-python>=5.0.0.93",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]
cloud = [
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "websockets>=17.4",
]
audio = [
    "sounddevice>=0.5.6",
]
ui = [
    "aiohttp>=3.14.5",
]

[project.scripts]
navigator = "navigator.bootstrap.main:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: needs the CUDA GPU",
    "camera: needs the webcam",
    "keys: needs real API keys in .env",
    "audio_device: needs a sound output device",
]
